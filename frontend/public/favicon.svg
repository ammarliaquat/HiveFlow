<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>

    <!-- Vibrant Cyan / Blue Flow Gradient -->
    <linearGradient id="flow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Electric Violet / Magenta Flow Gradient -->
    <linearGradient id="flow-purple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#E879F9" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.3" />
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Badge (Ensures high contrast in any browser tab theme) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="url(#border-glow)" stroke-width="1.5" />

  <!-- Ambient Glow in Badge Center -->
  <circle cx="32" cy="32" r="18" fill="#6366F1" opacity="0.35" filter="url(#neon-glow)" />

  <!-- Outer Isometric Hexagon Facets -->
  <!-- Upper Right Wing -->
  <path
    d="M32 10 L50 20.4 V41.6 L32 31.2 Z"
    fill="url(#flow-cyan)"
    opacity="0.95"
  />

  <!-- Lower Left Wing -->
  <path
    d="M32 54 L14 43.6 V22.4 L32 32.8 Z"
    fill="url(#flow-purple)"
    opacity="0.95"
  />

  <!-- Dynamic S-Flow Ribbon Through Core -->
  <path
    d="M17 24 C23 16, 41 16, 47 24 C52 30, 44 38, 32 38 C20 38, 12 46, 17 52 C23 60, 41 60, 47 52"
    stroke="#00F0FF"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#neon-glow)"
  />

  <!-- Inner Spark Node / Lakehouse Center -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="5" stroke="#38BDF8" stroke-width="1" fill="none" opacity="0.8" />

  <!-- Vertex Energy Accents -->
  <circle cx="32" cy="10" r="1.8" fill="#00F0FF" />
  <circle cx="50" cy="20.4" r="1.8" fill="#38BDF8" />
  <circle cx="50" cy="41.6" r="1.8" fill="#C084FC" />
  <circle cx="32" cy="54" r="1.8" fill="#818CF8" />
  <circle cx="14" cy="43.6" r="1.8" fill="#00F0FF" />
  <circle cx="14" cy="22.4" r="1.8" fill="#38BDF8" />
</svg>