<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none" className="hiveflow-logo">
  <defs>
    <!-- Gradients -->
    <linearGradient id="hf-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="hf-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="hf-grad-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hf-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM (Centered on X=50, Y=50, radius ~38) -->
  <g transform="translate(10, 0)">
    <!-- Ambient Background Glow -->
    <circle cx="50" cy="50" r="32" fill="#6366F1" opacity="0.18" filter="url(#hf-glow)" />

    <!-- Outer Hexagonal Frame / Facets -->
    <!-- Facet 1: Top & Right segments -->
    <path
      d="M50 14 L80 31.32 V66 L50 48.68 Z"
      fill="url(#hf-grad-accent)"
      opacity="0.9"
    />
    
    <!-- Facet 2: Bottom & Left segments -->
    <path
      d="M50 86 L20 68.68 V34 L50 51.32 Z"
      fill="url(#hf-grad-primary)"
      opacity="0.9"
    />

    <!-- Ribbon Flow (S-curve intertwining through core) -->
    <path
      d="M26 37.5 C36 24, 64 24, 74 37.5 C82 48, 70 60, 50 60 C30 60, 18 72, 26 82.5 C36 96, 64 96, 74 82.5"
      stroke="url(#hf-grad-glow)"
      stroke-width="5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
      filter="url(#hf-glow)"
    />

    <!-- Core Nexus / Spark Nodes -->
    <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />
    <circle cx="50" cy="50" r="7" stroke="#38BDF8" stroke-width="1.5" fill="none" opacity="0.8" />
    
    <!-- Vertex Energy Points -->
    <circle cx="50" cy="14" r="2.5" fill="#38BDF8" />
    <circle cx="80" cy="31.32" r="2.5" fill="#818CF8" />
    <circle cx="80" cy="66" r="2.5" fill="#A855F7" />
    <circle cx="50" cy="86" r="2.5" fill="#6366F1" />
    <circle cx="20" cy="68.68" r="2.5" fill="#06B6D4" />
    <circle cx="20" cy="34" r="2.5" fill="#38BDF8" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK -->
  <g transform="translate(115, 0)">
    <!-- Primary Brand Name -->
    <text
      x="0"
      y="54"
      font-family="Plus Jakarta Sans, Inter, system-ui, -apple-system, sans-serif"
      font-size="34"
      font-weight="800"
      letter-spacing="-0.03em"
      fill="#FFFFFF"
    >
      HIVE<tspan fill="url(#hf-grad-accent)">FLOW</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text
      x="2"
      y="74"
      font-family="JetBrains Mono, Inter, monospace"
      font-size="10.5"
      font-weight="600"
      letter-spacing="0.22em"
      fill="#818CF8"
    >
      GOVERNED LAKEHOUSE
    </text>
    
    <!-- Badge: by Hiveworx -->
    <rect x="235" y="32" width="85" height="18" rx="9" fill="#1E293B" stroke="#334155" stroke-width="0.75" />
    <text
      x="277.5"
      y="44"
      text-anchor="middle"
      font-family="Inter, system-ui, sans-serif"
      font-size="8.5"
      font-weight="600"
      letter-spacing="0.04em"
      fill="#94A3B8"
    >
      by Hiveworx
    </text>
  </g>
</svg>
